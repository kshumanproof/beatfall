<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Beatfall</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
  body{min-height:100dvh;display:flex;flex-direction:column}
  .missing{flex:1;display:flex;align-items:center;justify-content:center;padding:70px 24px 110px}
  .missing-in{width:100%;max-width:620px}
  .error-code{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 13px}
  h1{font-family:var(--serif);font-size:clamp(40px,7vw,62px);font-weight:600;letter-spacing:-.03em;line-height:1;margin:0 0 17px}
  .lede{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--ink-2);max-width:52ch;margin:0}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
  .actions .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  @media(max-width:520px){
    .topbar-in .right{display:none}
    .missing{align-items:flex-start;padding:54px 20px 80px}
    .actions{flex-direction:column}
    .actions .btn{width:100%}
  }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a href="/app" class="brand" aria-label="Beatfall projects">
    <svg class="mark" viewBox="14 8 36 50.5" aria-hidden="true" focusable="false"><g stroke="var(--gold)" stroke-width="1.4" stroke-linecap="round"><path d="M27.3 14v5.1"/><path d="M30.2 9.5v7.7"/><path d="M33.2 13.3v3.6"/></g><rect x="15" y="22.6" width="34" height="6.95" rx="1.6" fill="var(--gold)" transform="rotate(-12 32 26.08)"/><rect x="15" y="34.2" width="34" height="6.95" rx="1.6" fill="var(--blue)"/><rect x="15" y="42.3" width="34" height="6.95" rx="1.6" fill="var(--blue)"/><rect x="15" y="50.5" width="34" height="6.95" rx="1.6" fill="var(--blue)"/></svg>
    <span class="wordmark">Beat<span>fall</span></span>
  </a>
  <span class="slug">Page not found</span>
  <div class="right"><a class="btn btn-primary" href="/app">Go to projects</a></div>
</div></header>

<main class="missing">
  <div class="missing-in">
    <p class="error-code">404 · Page not found</p>
    <h1>That page isn&rsquo;t here.</h1>
    <p class="lede">The link may be old or mistyped. Nothing in your Beatfall projects was changed.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/app">Go to projects</a>
      <a class="btn" href="/help.html">Help &amp; shortcuts</a>
    </div>
  </div>
</main>

<script src="/app.js"></script>
<script>BF.applyMode(BF.readMode());</script>
</body>
</html>
