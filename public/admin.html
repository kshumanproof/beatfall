<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Behind a sign-in and of no use in a search result. This one is not
     conditional on the domain the way the beta-wide rule in vercel.json
     is: these three should never be indexed anywhere. -->
<meta name="robots" content="noindex, nofollow">
<title>Admin · Beatfall</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
  /* =======================================================================
     THE OPERATOR'S PAGE, the shell around it.

     Six destinations, one set of controls that applies to all of them, and
     the states a panel can be in drawn as six different things rather than
     one blank space. The views themselves are in /admin-ui.js.

     Nothing here invents a colour. Every value is a token out of theme.css,
     so this page follows the product into dark mode without a second
     palette to keep level with the first.
     ======================================================================= */
  .wrap{max-width:1400px;padding-top:22px}

  /* ------------------------------------------------------------------ nav --
     Six real destinations rather than toggles, the same decision the board's
     top bar made: the bar never changes shape, and the one you are standing
     on says so. Sticky, because the tables are long and losing the way out
     at the bottom of a page of accounts is how a screen starts feeling like
     a dead end. */
  .nav{position:sticky;top:0;z-index:60;background:var(--ground);
    border-bottom:1px solid var(--rule);margin-bottom:0}
  .nav-in{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;
    align-items:stretch;gap:2px;overflow-x:auto}
  .nav a{flex:0 0 auto;display:flex;align-items:center;padding:0 15px;height:46px;
    font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-2);
    text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;
    transition:color var(--settle),border-color var(--settle)}
  .nav a:hover{color:var(--ink)}
  .nav a.on{color:var(--blue-ink);border-bottom-color:var(--blue);font-weight:600}
  .nav a .badge{margin-left:7px;min-width:17px;padding:0 5px;height:17px;
    border-radius:9px;background:var(--red);color:var(--card);
    font-family:var(--mono);font-size:10px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center}

  /* --------------------------------------------------------- the controls --
     They apply to every view, so they live once above all six rather than
     being re-stated inside each. Every figure on the page is read through
     them, which is why the period and the population are never further away
     than this row. */
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding:14px 0 18px}
  .controls label{font-family:var(--sans);font-size:9.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
    margin-right:-4px}
  .controls .grow{flex:1 1 auto;min-width:0}
  .controls input[type=search],.controls input[type=number]{
    font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--card);
    border:1px solid var(--rule);border-radius:var(--r-ctl);padding:7px 11px}
  .controls input[type=search]{width:100%;max-width:280px}
  .controls input[type=number]{width:74px}
  .controls input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  .asof{font-family:var(--sans);font-size:11.5px;color:var(--ink-4);
    margin-left:auto;text-align:right}
  .asof b{color:var(--ink-2);font-weight:500}
  /* A reload says so instead of blanking the screen. Stale figures with a
     line admitting they are stale tell you more than an empty panel. */
  .working{height:2px;background:var(--rule-soft);overflow:hidden;margin-bottom:16px}
  .working span{display:block;height:100%;width:40%;background:var(--blue);
    animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  @media (prefers-reduced-motion:reduce){
    .working span{animation:none;width:100%;opacity:.5}
  }

  /* -------------------------------------------------------- the furniture --
     Tiles, lamps, rows and the six states a panel can be in. Shared by every
     view, which is why they are here and not in six copies. */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
  .tile{background:var(--surface);border:1px solid var(--rule-soft);
    border-radius:var(--r-card);padding:13px 15px}
  .tile .n{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .tile .l{font-family:var(--sans);font-size:9.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);margin-top:3px}
  .tile.warn{border-color:var(--gold-hair);background:var(--gold-soft)}
  .tile.warn .n{color:var(--gold)}
  .tile.bad{border-color:var(--red);background:var(--red-soft)}
  .tile.bad .n{color:var(--red)}
  .tile .of{font-family:var(--mono);font-size:13px;color:var(--ink-4);font-weight:400}

  /* The line under a figure saying which days and which people it covers.
     Written out rather than abbreviated: "30d" means nothing at a glance and
     being read is the whole job of this line. */
  .scope{font-family:var(--sans);font-size:10.5px;color:var(--ink-4);
    margin-top:5px;line-height:1.45}
  .no{color:var(--ink-4);font-family:var(--mono);cursor:help;
    border-bottom:1px dotted var(--ink-4)}
  .of{color:var(--ink-4);font-weight:400}
  .pct{font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-left:6px}
  .good{color:var(--sage)}
  td.bad,.bad.num{color:var(--red)}

  /* A health lamp. The WORD is the signal and the colour agrees with it,
     never the other way round. House rule from the board, and it matters
     more here where amber and red are the point of the screen. */
  .lamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .lamps>div{display:flex;align-items:center;gap:10px;padding:9px 12px;
    background:var(--surface);border:1px solid var(--rule-soft);
    border-radius:var(--r-card)}
  .lk{font-family:var(--sans);font-size:12px;color:var(--ink-2)}
  .lamp{margin-left:auto;font-family:var(--sans);font-size:9.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.09em;padding:3px 8px;
    border-radius:3px;white-space:nowrap}
  .lamp.ok{background:var(--sage-soft);color:var(--sage)}
  .lamp.warn{background:var(--gold-soft);color:var(--gold)}
  .lamp.bad{background:var(--red-soft);color:var(--red)}
  .lamp.unknown{background:var(--rule-soft);color:var(--ink-3)}

  /* The attention queue. One row per thing, the severity in a word, and the
     next step as a control rather than as a sentence telling you to go and
     find it. */
  .rows{display:flex;flex-direction:column;gap:8px}
  .row-item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;
    align-items:center;padding:11px 13px;background:var(--surface);
    border:1px solid var(--rule-soft);border-left:3px solid var(--rule);
    border-radius:var(--r-card)}
  .row-item.sev-high,.row-item.sev-urgent,.row-item.sev-stop{
    border-left-color:var(--red);background:var(--red-soft)}
  .row-item.sev-warn,.row-item.sev-normal{border-left-color:var(--gold-hair)}
  .ri-main{display:flex;align-items:baseline;gap:9px;min-width:0}
  .ri-title{font-size:13.5px;color:var(--ink);font-weight:500}
  .sev{font-family:var(--sans);font-size:9px;font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:var(--ink-3);flex:0 0 auto}
  .sev-high .sev,.sev-urgent .sev,.sev-stop .sev{color:var(--red)}
  .ri-sub{grid-column:1;font-size:11.5px;color:var(--ink-3)}
  .ri-acts{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:8px}
  .ri-go{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--blue);
    text-decoration:none;white-space:nowrap}
  .ri-go:hover{color:var(--blue-ink);text-decoration:underline}

  /* EMPTY, LOADING, PARTIAL, STALE, DENIED AND FAILED ARE SIX DIFFERENT
     THINGS. The old page had one appearance for all of them, which is how a
     broken query and a quiet month came to look identical. */
  .blank{padding:26px 20px;text-align:center;background:var(--surface);
    border:1px dashed var(--rule);border-radius:var(--r-card)}
  .blank-h{font-family:var(--serif);font-size:17px;color:var(--ink-2);margin:0}
  .blank-w{font-size:12.5px;color:var(--ink-4);margin:7px auto 0;max-width:56ch;
    line-height:1.6}
  .note.stale{background:var(--gold-soft);border:1px solid var(--gold-hair);
    color:var(--ink)}
  .note.partial{line-height:1.6}
  .track{margin-top:22px;font-size:12px}

  /* The funnel. A bar chart, because the useful thing about a sequence is the
     shape of the drop and a column of figures hides it. */
  .fstage{display:grid;grid-template-columns:230px 1fr 52px 48px;align-items:center;
    gap:12px;padding:5px 0}
  .flab{font-size:12.5px;color:var(--ink-2)}
  .flab .sub{font-size:11px;color:var(--ink-4);margin-top:2px;line-height:1.45}
  .fbar{height:19px;background:var(--rule-soft);border-radius:2px;overflow:hidden}
  .fbar span{display:block;height:100%;background:var(--blue);min-width:2px;
    transition:width .3s ease-out}
  .fnum{font-family:var(--mono);font-size:13px;font-weight:700;text-align:right;
    font-variant-numeric:tabular-nums}
  .fpct{font-family:var(--mono);font-size:11px;color:var(--ink-4);text-align:right;
    font-variant-numeric:tabular-nums}

  td .sub,.sub{font-size:11.5px;color:var(--ink-4);line-height:1.5}
  tr.internal{background:var(--blue-soft)}
  tr.internal td{border-bottom-color:var(--rule)}
  .pill.small{background:var(--rule-soft);color:var(--ink-3)}
  .pill.st-new{background:var(--red-soft);color:var(--red)}
  .pill.st-investigating{background:var(--gold-soft);color:var(--gold)}
  .pill.st-monitoring{background:var(--blue-soft);color:var(--blue)}
  .pill.st-resolved{background:var(--sage-soft);color:var(--sage)}
  .pill.st-open{background:var(--gold-soft);color:var(--gold)}
  .pill.st-waiting{background:var(--blue-soft);color:var(--blue)}
  .pill.st-closed{background:var(--rule-soft);color:var(--ink-3)}
  tr.sev-high td:first-child,tr.sev-urgent td:first-child{
    box-shadow:inset 3px 0 0 var(--red)}

  .btn.sm{padding:4px 10px;font-size:11.5px}
  .btn.warn{border-color:var(--gold-hair);color:var(--gold)}
  .btn.warn:hover{background:var(--gold-soft);border-color:var(--gold)}
  .acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}

  .note-item{padding:11px 13px;background:var(--surface);
    border:1px solid var(--rule-soft);border-radius:var(--r-card);margin-bottom:8px}
  .ni-head{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--ink-2);
    display:flex;gap:9px;align-items:baseline}
  .ni-body{font-size:13px;color:var(--ink);margin-top:5px;line-height:1.6;
    white-space:pre-wrap}

  .pager{display:flex;align-items:center;gap:12px;padding:4px 0 30px;
    font-size:12px;color:var(--ink-3)}

  .crumb{display:flex;align-items:center;gap:10px;padding:0 0 14px}
  .crumb button{font-family:var(--sans);font-size:12.5px;font-weight:600;
    color:var(--blue);background:none;border:none;cursor:pointer;padding:0}
  .crumb button:hover{color:var(--blue-ink);text-decoration:underline}

  /* ------------------------------------------------------------ the sheet --
     Every action is a named form with its own fields. No generic editor, the
     same rule the endpoint follows: an action that cannot be named cannot be
     performed. A scrim press steps out, because nothing here is typed at
     length and losing a one-line reason is cheap. Escape closes. */
  .scrim{position:fixed;inset:0;z-index:90;background:rgba(26,23,20,.52);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .sheet{width:min(520px,100%);max-height:calc(100vh - 56px);overflow-y:auto;
    background:var(--card);border:1px solid var(--rule);
    border-radius:var(--r-panel);box-shadow:var(--shadow-lift);padding:22px 24px}
  .sheet h3{font-family:var(--serif);font-size:21px;font-weight:600;
    margin:0 0 6px;color:var(--ink)}
  .sheet .why{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin:0 0 16px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-family:var(--sans);font-size:9.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;font-family:var(--sans);
    font-size:13.5px;color:var(--ink);background:var(--surface);
    border:1px solid var(--rule);border-radius:var(--r-ctl);padding:9px 11px}
  .fld textarea{min-height:76px;resize:vertical;line-height:1.55}
  .fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{
    outline:2px solid var(--blue);outline-offset:1px}
  .fld .hint{font-size:11.5px;color:var(--ink-4);margin-top:5px;line-height:1.5}
  .sheet-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .sheet .bad{color:var(--red);font-size:12.5px;line-height:1.55;margin:0 0 12px}

  /* A short-lived line saying what just happened. Not a toast that fades
     before it is read: it stays until the next action or the next reload. */
  .said{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;
    background:var(--ink);color:var(--ground);font-family:var(--sans);
    font-size:13px;padding:10px 16px;border-radius:var(--r-ctl);
    box-shadow:var(--shadow-lift);max-width:min(560px,calc(100vw - 32px))}

  @media (max-width:980px){
    .fstage{grid-template-columns:150px 1fr 44px 42px;gap:9px}
    .flab{font-size:11.5px}
    .asof{margin-left:0;text-align:left;width:100%}
  }

  /* ---------------------------------------------------------------------
     The account pill, same control as the board. These rules are a copy of
     the ones in index.html, which cannot share them because index.html does
     not load theme.css. If the pill changes there, change it here too.
     --------------------------------------------------------------------- */
  .acct{position:relative;flex:0 0 auto;align-self:center;
    margin-left:10px;padding-left:14px;border-left:1px solid var(--rule)}
  .avatar{display:flex;align-items:center;gap:9px;cursor:pointer;
    height:42px;padding:0 14px 0 5px;border-radius:23px;
    border:1px solid var(--rule);background:var(--card);color:var(--ink-2);
    font-family:var(--sans);font-size:13px;font-weight:600;box-shadow:var(--shadow);
    transition:border-color var(--settle),box-shadow var(--settle),color var(--settle)}
  .avatar .ini{width:32px;height:32px;border-radius:50%;flex:0 0 auto;
    background:var(--blue);color:var(--on-blue);font-size:13px;font-weight:600;
    letter-spacing:.02em;display:flex;align-items:center;justify-content:center}
  .avatar .cv{color:var(--ink-4);transition:transform var(--settle)}
  .avatar:hover{border-color:var(--ink-4);color:var(--ink);box-shadow:var(--shadow-lift)}
  .avatar.open{border-color:var(--blue);color:var(--ink)}
  .avatar.open .cv{transform:rotate(180deg)}
  .pop{position:absolute;top:calc(100% + 9px);right:0;z-index:70;width:266px;
    background:var(--card);border:1px solid var(--rule);border-radius:var(--r-panel);
    box-shadow:var(--shadow-lift);padding:7px 0;overflow:hidden}
  .popsep{height:1px;background:var(--rule-soft);margin:6px 0}
  .popitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    border:none;background:none;cursor:pointer;padding:8px 15px;
    font-family:var(--sans);font-size:13px;color:var(--ink);text-decoration:none}
  .popitem:hover{background:var(--rule-soft)}
  .popitem.on{background:var(--blue-soft);color:var(--blue-ink)}
  .popitem .aside{margin-left:auto;font-size:12px;color:var(--ink-4)}
  .popitem .tag{margin-left:auto;font-size:9.5px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-4)}
  .popwho{padding:9px 15px 4px}
  .popwho .n{font-size:13px;font-weight:600;color:var(--ink)}
  .popwho .e{font-size:11.5px;color:var(--ink-4);word-break:break-all}
  .popplan{padding:2px 15px 10px;display:flex;flex-direction:column;
    align-items:flex-start;gap:2px}
  .popplan span{font-size:11.5px;color:var(--ink-2)}

  @media (max-width:760px){
    .acct{margin-left:6px;padding-left:10px}
    .avatar{padding:0;height:38px;width:38px;justify-content:center;border-radius:50%}
    .avatar .lbl,.avatar .cv{display:none}
    .avatar .ini{width:36px;height:36px}
    .pop{width:min(300px,calc(100vw - 32px))}
    .popitem{min-height:40px}
  }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <div class="masthead">
    <a href="/app" class="brand" aria-label="Beatfall projects">
        <span class="brandmark"></span>
      </a>
    <span class="brandtag" role="img" aria-label="Where your story falls into place."></span>
  </div>
  <span class="slug">Admin</span>
  <div class="right">
  <div class="acct" id="acct">
    <button class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false">
      <span class="ini" id="avatarini">K</span>
      <span class="lbl">Account</span>
      <svg class="cv" width="10" height="10" viewBox="0 0 10 10" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l3-3 3 3"/></svg>
    </button>

    <div class="pop" id="acctmenu" hidden>
      <div class="popwho">
        <div class="n" id="whoname">Your account</div>
        <div class="e" id="whoemail"></div>
      </div>
      <div class="popplan">
        <span id="whoplan"></span>
        <span id="acctcredits" hidden></span>
      </div>

      <div class="popsep"></div>

      <a class="popitem" href="/settings.html">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--ink-3)" stroke-width="1.35" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/></svg>
        Settings</a>

      <a class="popitem" href="/app" id="popboard">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--ink-3)" stroke-width="1.35" aria-hidden="true"><rect x="2.4" y="3.2" width="11.2" height="9.6" rx="1.2"/><path d="M2.4 6.4h11.2"/></svg>
        Board</a>

      <button class="popitem" id="mode">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--ink-3)" stroke-width="1.35" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 2.4v11.2"/></svg>
        Appearance <span class="aside" id="modelabel">Auto</span></button>

      <a class="popitem" href="/help.html">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--ink-3)" stroke-width="1.35" aria-hidden="true"><path d="M3 2.5h7.4A2.6 2.6 0 0 1 13 5.1v8.4H5.6A2.6 2.6 0 0 1 3 10.9z"/><path d="M3 10.9a2.6 2.6 0 0 1 2.6-2.6H13M6 5.4h4"/></svg>
        Help &amp; shortcuts</a>

      <div class="popsep"></div>

      <button class="popitem" id="signout">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--ink-3)" stroke-width="1.35" aria-hidden="true"><path d="M6.2 13.4H3.4V2.6h2.8M9.6 11l2.9-3-2.9-3M12.5 8H6.6"/></svg>
        Sign out</button>
    </div>
  </div>
  </div>
</div></div>

<nav class="nav" id="nav" hidden><div class="nav-in">
  <a href="#overview" data-view="overview">Overview</a>
  <a href="#issues"   data-view="issues">Issues<span class="badge" id="issuecount" hidden></span></a>
  <a href="#writers"  data-view="writers">Writers</a>
  <a href="#product"  data-view="product">Product use</a>
  <a href="#money"    data-view="money">Money</a>
  <a href="#launch"   data-view="launch">Launch list</a>
  <a href="#system"   data-view="system">System</a>
</div></nav>

<div class="wrap">
  <div id="booting" class="muted"><span class="spinner"></span>Loading</div>

  <!-- DENIED AND FAILED ARE DIFFERENT THINGS. The old page showed "This page
       is for the account owner" for every failure, so a broken query and a
       signed-out session looked identical and the first was always read as
       the second. -->
  <div id="denied" class="note bad" hidden>
    <b>This page is for the account owner.</b>
    Your sign-in worked; this account is not an admin account.
  </div>

  <div id="main" hidden>
    <div class="controls" id="controls">
      <label for="days">Period</label>
      <select id="days" class="btn">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last 365 days</option>
        <option value="custom">A number of days</option>
      </select>
      <!-- A COUNT OF DAYS, NOT A PAIR OF DATES. Every window on this page
           ends now, because every query behind it reads forward from one
           date. A date picker with an end box that nothing honours would be
           exactly the kind of figure this rebuild exists to remove. -->
      <span id="customwrap" hidden>
        <input type="number" id="customdays" min="1" max="365" value="30"
          aria-label="How many days, ending now">
        <span class="sub">days, ending now</span>
      </span>

      <label for="who">Counting</label>
      <select id="who" class="btn">
        <option value="customers" selected>Customers</option>
        <option value="internal">Your own accounts</option>
        <option value="all">Everybody</option>
      </select>

      <span class="grow" id="searchwrap" hidden>
        <input type="search" id="search" placeholder="Search email, name or reference"
          aria-label="Search accounts">
      </span>

      <span id="sortwrap" hidden>
        <label for="sort">Order</label>
        <select id="sort" class="btn">
          <option value="last">Last worked</option>
          <option value="cost">Cost</option>
          <option value="credits">Credits used</option>
          <option value="days">Days worked</option>
          <option value="joined">Joined</option>
          <option value="failed">Failed calls</option>
        </select>
      </span>

      <span class="asof" id="asof"></span>
      <button class="btn" id="refresh">Refresh</button>
    </div>

    <div class="working" id="working" hidden><span></span></div>
    <div id="crumb"></div>
    <div id="view"></div>
    <div id="pager"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/app.js"></script>
<script type="module">
import * as UI from '/admin-ui.js';

BF.applyMode(BF.readMode());

const S = UI.state();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* How many accounts are drawn at once. Not a server limit: the endpoint pages
   the whole table and says when it truncated. This is about a page that has to
   be readable, with the count and the way to see the rest both stated. */
const PER_PAGE = 100;
let shown = PER_PAGE;

const VIEWS = {
  overview: UI.viewOverview,
  issues:   UI.viewIssues,
  writers:  UI.viewWriters,
  product:  UI.viewProduct,
  money:    UI.viewMoney,
  system:   UI.viewSystem,
  launch:   UI.viewLaunch,
  account:  UI.viewAccount,
  issue:    UI.viewIssue
};

/* ---------------------------------------------------------------------------
   WHERE YOU ARE, IN THE ADDRESS BAR.

   An alert mails you a link to one account and an overview row links to one
   issue, so both have to be a real address rather than a click somewhere on
   a page. Back goes back, and a link from an email lands where it says.
   --------------------------------------------------------------------------- */
function readHash() {
  const h = (location.hash || '').replace(/^#/, '');
  if (!h) return { view: 'overview' };
  const eq = h.indexOf('=');
  if (eq > 0) {
    const k = h.slice(0, eq), v = h.slice(eq + 1);
    if (k === 'account') return { view: 'account', id: v };
    if (k === 'issue') return { view: 'issue', id: v };
  }
  // An alert's own link points here. Delivery lives on System.
  if (h === 'alerts') return { view: 'system' };
  return VIEWS[h] ? { view: h } : { view: 'overview' };
}

function paintNav() {
  // The six destinations stay lit by the screen you are on. An account or an
  // issue is reached FROM one of them, so neither takes the light off it.
  const home = { account: 'writers', issue: 'issues' }[S.view] || S.view;
  document.querySelectorAll('.nav a').forEach(a =>
    a.classList.toggle('on', a.dataset.view === home));
}

function paintControls() {
  const v = S.view;
  $('searchwrap').hidden = v !== 'writers' && v !== 'launch';
  $('search').placeholder = v === 'launch' ? 'Search email, source or campaign' : 'Search email, name or reference';
  $('search').setAttribute('aria-label', v === 'launch' ? 'Search launch list' : 'Search accounts');
  $('sortwrap').hidden   = v !== 'writers';
  // The population filter only changes what the Writers list counts. Saying
  // so by disabling it beats leaving a control that quietly does nothing.
  $('who').disabled = v !== 'writers';
  $('who').title = v === 'writers' ? ''
    : 'Applies to the Writers list. Every other screen names its own population.';
  // An account and an issue are things rather than periods, and both are read
  // whole. A window control over them would narrow nothing.
  const periodless = v === 'account' || v === 'issue' || v === 'system';
  $('days').disabled = periodless;
  $('days').title = periodless
    ? 'This screen is not read through a period. It shows everything recorded.' : '';
}

function paintAsOf() {
  const at = S.loadedAt[cacheKey()];
  $('asof').innerHTML = at
    ? 'Read <b>' + esc(UI.when(at)) + '</b>'
    : '<b>Not read yet</b>';
}

function cacheKey() {
  return S.view + ':' + (S.id || '') + ':' + S.days + ':'
    + (S.view === 'writers' ? S.who : '');
}

/* ---------------------------------------------------------------------------
   FETCHING.

   A reload keeps the figures that are already on screen and raises a working
   strip, because a view that blanks itself while reloading tells you less than
   one that admits it is reloading. A view that failed says which view and
   leaves the other five alone, which is the whole reason the endpoint is split
   by view in the first place.
   --------------------------------------------------------------------------- */
async function load(force) {
  const key = cacheKey();
  if (!force && S.data[key]) { draw(); return; }

  S.loading = true;
  $('working').hidden = false;
  S.failed = null;

  const q = new URLSearchParams({ view: S.view, days: String(S.days), who: S.who });
  if (S.id) q.set('id', S.id);

  try {
    const d = await BF.api('/api/admin?' + q.toString());
    S.data[key] = d;
    S.loadedAt[key] = new Date().toISOString();
    d.loaded_at = S.loadedAt[key];
    if (S.view === 'overview') paintIssueBadge(d);
  } catch (e) {
    if (e.status === 403 || e.code === 'not_admin') return refuseWhole();
    S.failed = e;
  } finally {
    S.loading = false;
    $('working').hidden = true;
  }
  draw();
}

function refuseWhole() {
  $('booting').hidden = true;
  $('main').hidden = true;
  $('nav').hidden = true;
  $('denied').hidden = false;
}

function paintIssueBadge(d) {
  const open = (d.attention || []).filter(a => a.kind === 'issue').length;
  const b = $('issuecount');
  b.textContent = String(open);
  b.hidden = !open;
}

/* ---------------------------------------------------------------------------
   DRAWING. Every path through here ends in markup, including the ones where
   nothing arrived.
   --------------------------------------------------------------------------- */
function draw() {
  paintNav();
  paintControls();
  paintAsOf();

  const key = cacheKey();
  const d = S.data[key];
  const box = $('view');
  $('crumb').innerHTML = crumbFor();
  $('pager').innerHTML = '';

  if (S.failed && !d) {
    box.innerHTML = '<div class="note bad"><b>This section could not be built.</b> '
      + esc(S.failed.message || 'The server did not answer.')
      + ' The other five screens are unaffected. Nothing on the account has '
      + 'changed.</div>'
      + '<div class="acts"><button class="btn btn-primary" id="retry">Try again</button></div>';
    const r = $('retry');
    if (r) r.addEventListener('click', () => load(true));
    return;
  }
  if (!d) {
    box.innerHTML = '<p class="muted"><span class="spinner"></span>Reading</p>';
    return;
  }

  // A view that failed on a RELOAD, with good figures still in hand. Both
  // facts are true and both are said, rather than one quietly replacing the
  // other.
  const head = S.failed
    ? '<div class="note bad"><b>The last refresh did not work.</b> '
      + esc(S.failed.message || 'The server did not answer.')
      + ' What is below is the reading from ' + esc(UI.when(S.loadedAt[key]))
      + '.</div>' : '';

  if (S.view === 'writers') { box.innerHTML = head + drawWriters(d); return; }
  if (S.view === 'launch') { box.innerHTML = head + drawLaunch(d); return; }
  box.innerHTML = head + VIEWS[S.view](d);
}

function crumbFor() {
  if (S.view === 'account')
    return '<div class="crumb"><button data-go="writers">Back to writers</button></div>';
  if (S.view === 'issue')
    return '<div class="crumb"><button data-go="issues">Back to issues</button></div>';
  return '';
}

let launchStatus = 'available';
function drawLaunch(d) {
  const rows = UI.filterLaunch(d.leads, S.search, launchStatus);
  const page = rows.slice(0, shown);
  if (rows.length > page.length) $('pager').innerHTML = '<div class="pager"><span>Showing ' + page.length
    + ' of ' + rows.length + ' matches.</span><button class="btn sm" id="more">Show '
    + Math.min(PER_PAGE, rows.length-page.length) + ' more</button></div>';
  return UI.viewLaunch(d, page, rows.length, launchStatus, !!S.failed);
}

/* Filtering, ordering and paging happen here rather than inside the view, so
   the view can be rendered against a fixture in a test without any of it. */
function drawWriters(d) {
  const needle = S.search.trim().toLowerCase();
  let rows = (d.writers || []).slice();
  if (needle) rows = rows.filter(r =>
    (r.email || '').toLowerCase().includes(needle)
    || (r.name || '').toLowerCase().includes(needle)
    || (r.tag || '').toLowerCase().includes(needle)
    || (r.id || '').toLowerCase().includes(needle));

  const num = v => Number(v || 0);
  const by = {
    last:    (a, b) => String(b.last_worked || '').localeCompare(String(a.last_worked || '')),
    cost:    (a, b) => num(b.cost_usd) - num(a.cost_usd),
    credits: (a, b) => num(b.credits_used_this_period) - num(a.credits_used_this_period),
    days:    (a, b) => num(b.work_days) - num(a.work_days),
    joined:  (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')),
    failed:  (a, b) => num(b.failed_calls) - num(a.failed_calls)
  }[S.sort] || null;
  if (by) rows.sort(by);

  const total = rows.length;
  const page = rows.slice(0, shown);
  const markup = VIEWS.writers(Object.assign({}, d, { writers: page }), S.search);

  if (total > page.length) {
    $('pager').innerHTML = '<div class="pager"><span>Showing ' + page.length
      + ' of ' + total + ' accounts that match.</span>'
      + '<button class="btn sm" id="more">Show ' + Math.min(PER_PAGE, total - page.length)
      + ' more</button></div>';
  } else if (total > PER_PAGE) {
    $('pager').innerHTML = '<div class="pager"><span>Showing all ' + total
      + '.</span></div>';
  }
  return markup;
}

/* ---------------------------------------------------------------------------
   THE ACTIONS.

   One form per named action, matching the endpoint's list exactly. There is
   no generic "edit this profile" here for the same reason there is none
   there: an action that cannot be named cannot be performed, so nobody can
   discover a way to set a role through a control built for credits.

   `enforced` is deliberately absent from the budget form. The endpoint
   refuses it; this page does not offer it. Two refusals, on purpose, because
   Kris asked for the figures to be watched before anything acts on them.
   --------------------------------------------------------------------------- */
const ACTIONS = {
  alert_ack: {
    title: 'Mark this alert as seen',
    why: 'It stays in the record. This only stops it appearing in the queue and '
       + 'in the daily digest.',
    go: 'Mark as seen', fields: []
  },
  issue_status: {
    title: 'Change the state of this issue',
    why: 'Resolving one needs a reason. An issue closed with nothing written down '
       + 'teaches nobody anything the second time it appears, and the second time '
       + 'is exactly when somebody goes looking.',
    go: 'Save', fields: [
      { name: 'status', label: 'State', type: 'select', value: 'investigating',
        options: [['investigating', 'Looking at it'], ['monitoring', 'Watching'],
                  ['new', 'New'], ['resolved', 'Resolved']] },
      { name: 'reason', label: 'Why', type: 'textarea',
        hint: 'Required to resolve it. Left blank for any other state.' }
    ]
  },
  issue_assign: {
    title: 'Assign this issue',
    why: 'A name, so a list of open issues says who is holding each one.',
    go: 'Save', fields: [{ name: 'assignee', label: 'Who', type: 'text' }]
  },
  issue_note: {
    title: 'Write a note on this issue',
    why: 'What you found, what you ruled out, what you tried. This is the half '
       + 'that is useful in six months.',
    go: 'Save the note', fields: [{ name: 'body', label: 'Note', type: 'textarea' }]
  },
  help_pause: {
    title: 'Pause the paid writing help',
    why: 'Their boards, notes, outline and downloads are untouched, and placing '
       + 'notes by hand still works. The only thing that stops is the metered '
       + 'help that costs money. They are told why, in those words.',
    go: 'Pause it', fields: [
      { name: 'reason', label: 'Why', type: 'textarea',
        hint: 'Required. The account holder is shown a message, not this text, '
            + 'but this is what the record will say.' }
    ]
  },
  help_resume: {
    title: 'Let the writing help work again',
    why: 'Takes the pause off. Nothing else about the account changes.',
    go: 'Let it work', fields: []
  },
  credit_correction: {
    title: 'Correct credits',
    why: 'Goes to the bought bucket, which never expires, so an apology is not '
       + 'quietly smaller than it looked. A negative figure takes credits away. '
       + 'Writes a ledger row either way, and the ledger refuses the same '
       + 'movement twice.',
    go: 'Apply the correction', fields: [
      { name: 'credits', label: 'Credits', type: 'number',
        hint: 'Up to 500 either way. Anything larger is refused rather than '
            + 'applied, because a typed figure with an extra zero on it should be.' },
      { name: 'reason', label: 'Why', type: 'textarea' }
    ]
  },
  budget_set: {
    title: 'Set a spending figure',
    why: 'Figures only. Nothing on this page can switch enforcement on, and the '
       + 'endpoint refuses a request that tries. Every figure here is watched so '
       + 'the record can show whether it would ever have been right.',
    go: 'Save the figures', fields: [
      { name: 'scope', label: 'Applies to', type: 'select', value: 'paid_period',
        options: [['paid_period', 'A subscriber, per allowance period'],
                  ['trial_account', 'A trial account, whole trial'],
                  ['single_action', 'One action']] },
      { name: 'warn_usd', label: 'Warn at, in dollars', type: 'number' },
      { name: 'urgent_usd', label: 'Urgent at, in dollars', type: 'number' },
      { name: 'stop_usd', label: 'Would stop at, in dollars', type: 'number',
        hint: 'Recorded and observed. Nothing is stopped.' },
      { name: 'note', label: 'Note', type: 'text',
        hint: 'Who approved it and when, in your own words.' }
    ]
  },
  case_open: {
    title: 'Open a support case',
    why: 'So a conversation with a writer has somewhere to live that is not an '
       + 'inbox.',
    go: 'Open it', fields: [{ name: 'subject', label: 'Subject', type: 'text' }]
  },
  case_status: {
    title: 'Change the state of this case',
    go: 'Save', fields: [
      { name: 'status', label: 'State', type: 'select', value: 'waiting',
        options: [['open', 'Open'], ['waiting', 'Waiting on them'], ['closed', 'Closed']] }
    ]
  },
  marketing_set: {
    title: 'Record a marketing permission',
    why: 'The permission is theirs and an operator may only record what they were '
       + 'told. Turning it on needs a source. Turning it off needs nothing, '
       + 'because somebody asking to be left alone is never refused.',
    go: 'Record it', fields: [
      { name: 'opted_in', label: 'Permission', type: 'select', value: 'false',
        options: [['false', 'They asked to be left alone'],
                  ['true', 'They gave permission']] },
      { name: 'source', label: 'Where it came from', type: 'text',
        hint: 'Required only when they gave permission.' }
    ]
  },
  hold_clear: {
    title: 'Clear a stuck reservation',
    why: 'A reservation open for hours is not work in progress. It is a request '
       + 'that went away without settling, and it counts against every ceiling '
       + 'until it is cleared. Closed as unknown rather than as finished, '
       + 'because nobody can say whether the provider did the work.',
    go: 'Clear it', fields: [{ name: 'id', label: 'Reservation', type: 'number' }]
  }
};

let sheetEl = null;

function openSheet(action, ctx) {
  const spec = ACTIONS[action];
  if (!spec) return;
  closeSheet();

  /* ONE KEY PER OPENING. A double press of Save, or a retry after an answer
     that never came back, is the same press and is deduped against itself.
     A fresh opening is a fresh action. */
  const idem = (crypto && crypto.randomUUID) ? crypto.randomUUID()
    : String(Date.now()) + Math.random().toString(16).slice(2);

  const fields = (spec.fields || []).map(f => {
    const id = 'f_' + f.name;
    const input = f.type === 'textarea'
      ? '<textarea id="' + id + '"></textarea>'
      : f.type === 'select'
      ? '<select id="' + id + '">' + f.options.map(([v, l]) =>
          '<option value="' + esc(v) + '"' + (v === f.value ? ' selected' : '')
          + '>' + esc(l) + '</option>').join('') + '</select>'
      : '<input id="' + id + '" type="' + esc(f.type) + '"'
        + (f.value !== undefined ? ' value="' + esc(f.value) + '"' : '') + '>';
    return '<div class="fld"><label for="' + id + '">' + esc(f.label) + '</label>'
      + input + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '')
      + '</div>';
  }).join('');

  sheetEl = document.createElement('div');
  sheetEl.className = 'scrim';
  sheetEl.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"'
    + ' aria-label="' + esc(spec.title) + '">'
    + '<h3>' + esc(spec.title) + '</h3>'
    + (spec.why ? '<p class="why">' + esc(spec.why) + '</p>' : '')
    + '<p class="bad" id="sheeterr" hidden></p>'
    + fields
    + '<div class="sheet-acts">'
    + '<button class="btn" id="sheetno">Cancel</button>'
    + '<button class="btn btn-primary" id="sheetgo">' + esc(spec.go || 'Save') + '</button>'
    + '</div></div>';
  document.body.appendChild(sheetEl);

  sheetEl.addEventListener('click', e => { if (e.target === sheetEl) closeSheet(); });
  sheetEl.querySelector('#sheetno').addEventListener('click', closeSheet);
  sheetEl.querySelector('#sheetgo').addEventListener('click',
    () => submit(action, spec, ctx, idem));

  const first = sheetEl.querySelector('input,select,textarea');
  if (first) first.focus();
}

function closeSheet() {
  if (sheetEl) { sheetEl.remove(); sheetEl = null; }
}

async function submit(action, spec, ctx, idem) {
  const body = { action, idem };
  if (ctx.user) body.user_id = ctx.user;
  if (ctx.id) body.id = ctx.id;

  (spec.fields || []).forEach(f => {
    const el = sheetEl.querySelector('#f_' + f.name);
    if (!el) return;
    let v = el.value;
    if (f.type === 'number') body[f.name] = v === '' ? null : Number(v);
    else if (f.name === 'opted_in') body.opted_in = (v === 'true');
    else body[f.name] = v;
  });

  const go = sheetEl.querySelector('#sheetgo');
  const err = sheetEl.querySelector('#sheeterr');
  go.disabled = true;
  go.textContent = 'Working';

  try {
    const r = await BF.api('/api/admin', {
      method: 'POST', body: JSON.stringify(body)
    });
    closeSheet();
    say(r.already ? 'Already done. Nothing was applied a second time.' : 'Done.');
    // The screen is re-read rather than patched, so what you see afterwards is
    // what the database says rather than what this page assumed.
    load(true);
  } catch (e) {
    /* A REFUSAL IS NOT A FAILURE AND IS NOT DRAWN AS ONE. The endpoint
       records both; this says which it was, in the endpoint's own words, and
       leaves the form filled in so the missing half can be typed. */
    go.disabled = false;
    go.textContent = spec.go || 'Save';
    err.hidden = false;
    err.textContent = e.code === 'refused'
      ? 'Not done: ' + (e.message || 'refused') + '.'
      : (e.message || 'That did not complete.')
        + ' Check the account before trying again.';
  }
}

let saidTimer = null;
function say(words) {
  const old = document.querySelector('.said');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'said';
  el.setAttribute('role', 'status');
  el.textContent = words;
  document.body.appendChild(el);
  clearTimeout(saidTimer);
  saidTimer = setTimeout(() => el.remove(), 6000);
}

/* ---------------------------------------------------------------------------
   ONE LISTENER FOR EVERY CONTROL THE VIEWS DRAW.

   The views return markup and bind nothing, which is what lets them be
   rendered in a test without a browser. Everything they put a data attribute
   on is answered here.
   --------------------------------------------------------------------------- */
document.addEventListener('click', e => {
  if (e.target.id === 'launch-export') {
    const d = S.data[cacheKey()];
    if (S.view !== 'launch' || !d || d.truncated || S.failed || S.loading) return;
    const rows = UI.filterLaunch(d.leads, S.search, launchStatus).filter(r => !r.unsubscribed_at);
    if (!rows.length) return;
    const url = URL.createObjectURL(new Blob([UI.launchCsv(rows)], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url; link.download = 'beatfall-launch-list-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  }
  const act = e.target.closest('[data-do]');
  if (act) {
    const action = act.dataset.do;
    // Marking an alert as seen has nothing to ask, so it does not ask.
    if (action === 'alert_ack') {
      runStraight(action, { id: Number(act.dataset.id) });
      return;
    }
    openSheet(action, { user: act.dataset.user, id: act.dataset.id });
    return;
  }

  const acc = e.target.closest('[data-open-account]');
  if (acc) { location.hash = 'account=' + acc.dataset.openAccount; return; }

  const iss = e.target.closest('[data-open-issue]');
  if (iss) { location.hash = 'issue=' + iss.dataset.openIssue; return; }

  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }

  if (e.target.id === 'more') { shown += PER_PAGE; draw(); return; }
});

async function runStraight(action, ctx) {
  const idem = (crypto && crypto.randomUUID) ? crypto.randomUUID()
    : String(Date.now()) + Math.random().toString(16).slice(2);
  try {
    const r = await BF.api('/api/admin', {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action, idem }, ctx))
    });
    say(r.already ? 'Already marked as seen.' : 'Marked as seen.');
    load(true);
  } catch (e) {
    say(e.code === 'refused' ? 'Not done: ' + (e.message || 'refused') + '.'
      : (e.message || 'That did not complete.'));
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetEl) { closeSheet(); return; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'launch-status') { launchStatus = e.target.value; shown = PER_PAGE; draw(); }
});

/* ------------------------------------------------------------- the routing */
function route() {
  const r = readHash();
  const changed = r.view !== S.view || (r.id || '') !== (S.id || '');
  S.view = r.view;
  S.id = r.id || null;
  if (changed) shown = PER_PAGE;
  load(false);
}
window.addEventListener('hashchange', route);

/* ------------------------------------------------------- the global controls
   Each one changes the state, then re-reads. The state object is shared with
   the views, so a period changed here cannot leave one panel describing a
   different month from the one beside it. */
$('days').addEventListener('change', e => {
  const v = e.target.value;
  $('customwrap').hidden = v !== 'custom';
  if (v === 'custom') { S.days = Number($('customdays').value) || 30; }
  else S.days = Number(v);
  load(false);
});
$('customdays').addEventListener('change', e => {
  const n = Math.min(365, Math.max(1, Number(e.target.value) || 30));
  e.target.value = n;
  S.days = n;
  load(false);
});
$('who').addEventListener('change', e => { S.who = e.target.value; load(false); });
$('refresh').addEventListener('click', () => load(true));

/* SEARCH AND ORDER DO NOT RE-READ THE SERVER. Both work on the list already
   in hand, so typing does not spend a query per keystroke, and the context is
   kept when you leave the screen and come back. */
$('search').addEventListener('input', e => { S.search = e.target.value; shown = PER_PAGE; draw(); });
$('sort').addEventListener('change', e => { S.sort = e.target.value; draw(); });

/* ---------------------------------------------------------------------------
   The account pill. Same control, same place, same behaviour as the board, so
   being on Admin never costs you the way to Settings, the mode switch or the
   way out. No "Admin" row in it, because you are standing on it.
   --------------------------------------------------------------------------- */
const avatar  = $('avatar');
const acctpop = $('acctmenu');

function closeAcct(){
  acctpop.hidden = true;
  avatar.classList.remove('open');
  avatar.setAttribute('aria-expanded', 'false');
}
avatar.addEventListener('click', e => {
  e.stopPropagation();
  const open = acctpop.hidden;
  acctpop.hidden = !open;
  avatar.classList.toggle('open', open);
  avatar.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', e => {
  if (!acctpop.hidden && !acctpop.contains(e.target)) closeAcct();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAcct(); });

$('mode').addEventListener('click', e => {
  e.stopPropagation();
  BF.cycleMode($('modelabel'));
});
$('signout').addEventListener('click', () => BF.signOut());

async function paintWho(){
  let me;
  try { me = await BF.api('/api/account'); } catch (e) { return; }
  const name = me.display_name || (me.email || '').split('@')[0] || 'You';
  $('whoname').textContent  = name;
  $('whoemail').textContent = me.email || '';
  $('avatarini').textContent = (name.trim()[0] || '?').toUpperCase();
  /* AN ADMIN ACCOUNT IS NOT A CUSTOMER, AND THIS MENU USED TO SAY IT WAS.
     An account carrying is_admin without the Owner plan exists to read the
     reports and does nothing else: no board, no credits, nothing to
     subscribe to. Printing which plan it is on, counting credits it cannot
     spend, and offering a Board that only bounces back here are three ways
     of calling it a writer. So the whole plan block goes and so does Board,
     and what is left is who you are signed in as and the way out.
     An owner account still gets everything, because that one does write. */
  if (me.is_admin && !me.unlimited) {
    const plan = document.querySelector('.popplan'); if (plan) plan.hidden = true;
    const board = $('popboard'); if (board) board.remove();
    return;
  }
  /* Not "$12 a month". An annual subscriber pays $99 and was being quoted a
     price they do not pay, and nothing on the account records which interval
     they chose. Says what is true either way, then the renewal date. Same
     line as the board and Settings: if one changes, change all three. */
  const renews = me.current_period_end
    ? new Date(me.current_period_end).toLocaleDateString(undefined,
        {month: 'short', day: 'numeric', year: 'numeric'})
    : null;
  $('whoplan').textContent =
      me.unlimited            ? 'Owner · no limits'
    : me.plan === 'beatfall'  ? ('Beatfall' + (me.cancel_at_period_end
        ? (renews ? ' · ends ' + renews : ' · ending')
        : (renews ? ' · renews ' + renews : '')))
    : (me.plan === 'trial' && me.trialing) ? 'Free trial'
    : 'No plan';
  // The owner allowance is a stand-in for infinity, so don't print it.
  if (!me.unlimited) {
    const cr = $('acctcredits');
    cr.textContent = me.credits_left + ' of ' + me.credits_allowance + ' credits left';
    cr.hidden = false;
  }
}

(async function () {
  if (!await BF.requireSession()) return;
  BF.applyMode(BF.readMode(), $('modelabel'));
  paintWho();

  S.sort = 'last';
  $('booting').hidden = true;
  $('nav').hidden = false;
  $('main').hidden = false;
  route();
})();
</script>
</body>
</html>
